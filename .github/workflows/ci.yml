name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emr_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emr_test
      BETTER_AUTH_SECRET: test-secret-for-ci-only-minimum-32-chars
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run test:db:migrate
      - run: bun run test:integration
      - run: bun run build
